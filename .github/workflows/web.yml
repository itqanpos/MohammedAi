name: Build Web
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: إنشاء مجلدات المنصة
        run: flutter create . --platforms=web --project-name=mohamed_ai

      - name: تنزيل الحزم
        run: flutter pub get

      - name: بناء الويب
        run: flutter build web --release

      - name: رفع الملف الناتج
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
