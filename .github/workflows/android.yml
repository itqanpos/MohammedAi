name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: إنشاء مجلدات المنصة
        run: flutter create . --platforms=android --project-name=mohamed_ai

      - name: تنزيل الحزم
        run: flutter pub get

      - name: بناء APK
        run: flutter build apk --release

      - name: رفع الملف الناتج
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
