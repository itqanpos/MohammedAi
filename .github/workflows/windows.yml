name: Build Windows
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: إنشاء مجلدات المنصة
        run: flutter create . --platforms=windows --project-name=mohamed_ai

      - name: تنزيل الحزم
        run: flutter pub get

      - name: تفعيل سطح المكتب
        run: flutter config --enable-windows-desktop

      - name: بناء الويندوز
        run: flutter build windows --release

      - name: رفع الملف الناتج
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows/x64/runner/Release/
