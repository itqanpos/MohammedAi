<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="محمد AI — المساعد الشخصي الذكي">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="محمد AI">
  <meta name="theme-color" content="#00897B">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <title>محمد AI</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #FAFAFA; font-family: 'Cairo', sans-serif;
    }
    #loading-screen {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      background: #FAFAFA; transition: opacity 0.3s ease; z-index: 9999;
    }
    .spinner {
      width: 48px; height: 48px; border: 4px solid #B2DFDB;
      border-top-color: #00897B; border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div class="spinner"></div>
    <h2 style="color: #00897B; margin: 0;">محمد AI</h2>
    <p style="color: #757575; margin: 0;">جاري التحميل...</p>
  </div>
  
  <script src="flutter_bootstrap.js" async></script>
  
  <script>
    // السطر ده هو اللي بيخفي شاشة التحميل لما التطبيق يجهز
    window.addEventListener('flutter-first-frame', function() {
      var el = document.getElementById('loading-screen');
      if (el) {
        el.style.opacity = '0';
        setTimeout(function() { el.style.display = 'none'; }, 300);
      }
    });
  </script>
</body>
</html>
